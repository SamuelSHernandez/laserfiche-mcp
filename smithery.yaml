# Smithery (https://smithery.ai) install manifest.
# Lets users install with: npx -y @smithery/cli install laserfiche-mcp --client claude

startCommand:
  type: stdio
  command: uvx
  args:
    - laserfiche-mcp

configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
    - LF_REPO_API_URL
    - LF_REPOSITORY_ID
    - LF_USERNAME
    - LF_PASSWORD
  properties:
    LF_DEPLOYMENT_MODE:
      type: string
      enum: [self_hosted, cloud]
      default: self_hosted
      description: "self_hosted is the battle-tested path — real deployments run it. cloud (BETA, unverified against a live tenant) targets Laserfiche Cloud's service-app flow; must be set together with LF_AUTH_MODE=api_key and LF_API_VERSION=v2."
    LF_REPO_API_URL:
      type: string
      format: uri
      description: "Base URL of the Laserfiche Repository API Server, e.g. https://lf.example.com/LFRepositoryAPI"
    LF_REPOSITORY_ID:
      type: string
      description: "Repository name or ID to operate against."
    LF_API_VERSION:
      type: string
      enum: [v1, v2]
      default: v1
      description: "LFRepositoryAPI version exposed by your server. Probe with GET {LF_REPO_API_URL}/v1/Repositories vs /v2/Repositories — whichever returns a JSON 200 is your version."
    LF_AUTH_MODE:
      type: string
      enum: [password, oauth, api_key]
      default: password
      description: "Auth strategy. 'password' exchanges username/password for a bearer token via /{api_version}/Repositories/{repo}/Token. 'oauth' uses a client_credentials grant against an LFDS-compatible OAuth server. 'api_key' is Laserfiche Cloud's service-app JWT-assertion flow (BETA) — requires LF_DEPLOYMENT_MODE=cloud."
    LF_USERNAME:
      type: string
      description: "Service account username (for password mode)."
    LF_PASSWORD:
      type: string
      format: password
      description: "Service account password (for password mode)."
    LF_OAUTH_TOKEN_URL:
      type: string
      format: uri
      description: "OAuth token endpoint (for oauth mode)."
    LF_CLIENT_ID:
      type: string
      description: "OAuth client ID (for oauth mode)."
    LF_CLIENT_SECRET:
      type: string
      format: password
      description: "OAuth client secret (for oauth mode)."
    LF_OAUTH_SCOPE:
      type: string
      description: "Optional OAuth scope (for oauth mode, and for api_key/Cloud mode)."
    LF_CLOUD_ACCESS_KEY:
      type: string
      format: password
      description: "Base64-encoded 'access key' JSON blob exported from the Laserfiche Developer Console (App Configuration > Authentication) for an OAuth service app — contains customerId, domain, clientId, and an EC (P-256) signing key. Required for api_key mode."
    LF_CLOUD_SERVICE_PRINCIPAL_KEY:
      type: string
      format: password
      description: "Service principal key created for the service principal in Laserfiche Account Administration — a separate secret, not part of LF_CLOUD_ACCESS_KEY. Required for api_key mode."
    LF_READ_ONLY:
      type: boolean
      default: true
      description: "When true, only read tools are registered. Default true for safety."
    LF_VERIFY_SSL:
      type: boolean
      default: true
      description: "Verify the server's TLS certificate. Set false only for self-signed cert dev environments."
    LF_RETRY_ATTEMPTS:
      type: integer
      minimum: 0
      maximum: 10
      default: 3
      description: "Retries on transient 5xx/429/connection failures with exponential backoff."
    LF_REQUEST_TIMEOUT_SECONDS:
      type: number
      default: 30
      description: "Per-request HTTP timeout in seconds."
    LF_MAX_RESULTS_DEFAULT:
      type: integer
      default: 25
      description: "Default page size for list/search tools."
    LF_MAX_RESULTS_CEILING:
      type: integer
      default: 200
      description: "Hard cap on page size regardless of caller-requested value."
    LF_MAX_PAGE_SIZE:
      type: integer
      default: 100
      description: "Dedicated page-size cap for search_natural. Some self-hosted SimpleSearches implementations reject $top above an internal limit."
    LF_EDOC_MAX_BYTES:
      type: integer
      default: 25000000
      description: "Cap on get_document_edoc downloads in bytes/text modes (default 25 MB)."
    LF_LOG_LEVEL:
      type: string
      enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
      default: INFO
      description: "Python logging verbosity."
    LF_LOG_FORMAT:
      type: string
      enum: [text, json]
      default: text
      description: "Log line format: human-readable 'text', or 'json' (one JSON object per line, for log pipelines)."
    LF_LEGACY_TOOL_NAMES:
      type: boolean
      default: false
      description: "Also register the v1.x verb-first tool aliases (get_entry, set_fields, ...) alongside the laserfiche_* names. Default false since v2.3.0 (registering both roughly doubled the tool catalog the model pays for on every request). Set true only if an existing integration depends on the legacy names."
    LF_SEARCH_TIMEOUT_SECONDS:
      type: number
      default: 60
      description: "How long search_content waits for an async search before abandoning it and releasing the search token."
    LF_SEARCH_POLL_INTERVAL_SECONDS:
      type: number
      default: 1
      description: "Delay between search_content status polls; backs off toward 2s on long searches."
    LF_SEARCH_CONTEXT_HITS_MAX:
      type: integer
      default: 10
      description: "Hard cap on matched passages returned per entry by search_content, regardless of the caller-requested hits_per_entry."
    LF_VALIDATE_NAMES:
      type: boolean
      default: true
      description: "Pre-flight field / tag / template / link-type names against cached schema definitions before write calls. Returns structured invalid_*_name errors instead of opaque server 400s."
    LF_SCHEMA_CACHE_TTL_SECONDS:
      type: integer
      default: 300
      description: "Cache window for the schema-definition lookups that back LF_VALIDATE_NAMES and LF_VALIDATE_REQUIRED_FIELDS. Set to 0 to disable caching."
    # --- Write-mode safety guards (only relevant when LF_READ_ONLY=false) -----
    LF_WRITE_PATHS_ALLOW:
      type: string
      description: "Comma-separated path prefixes where writes are permitted (case-insensitive). Strongest single fence — recommended for any non-trivial write deployment. Example: \\Imports\\Pending,\\Archive\\WIP"
    LF_WRITE_PATHS_DENY:
      type: string
      description: "Comma-separated path prefixes where writes are refused. Deny wins over allow."
    LF_WRITE_TOOLS_ALLOWED:
      type: string
      description: "Comma-separated write-tool names to scope what registers at startup. Example: merge_fields,merge_tags,assign_template for metadata-only deployments."
    LF_DELETE_FOLDER_MAX_DESCENDANTS:
      type: integer
      default: 50
      description: "Refuse folder deletes above this immediate-child count unless force_large_delete=true is passed with the confirmation token."
    LF_REQUIRE_AUDIT_REASON:
      type: boolean
      default: false
      description: "When true, delete_entry refuses without an audit_reason_id. Use get_audit_reasons to enumerate valid IDs."
    LF_CONFIRMATION_SECRET:
      type: string
      format: password
      description: "Optional secret for signing destructive-operation confirmation tokens. Unset: a random per-process key (restarts invalidate pending tokens — safer single-instance default). Set to keep tokens valid across restarts and across instances sharing the secret. Treat like a password."
    LF_VALIDATE_REQUIRED_FIELDS:
      type: boolean
      default: true
      description: "Validate repository-wide required fields client-side before assign_template PUTs."
    LF_IMPORT_MAX_BYTES:
      type: integer
      default: 25000000
      description: "Client-side cap on import_document payload size (default 25 MB)."
