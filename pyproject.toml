[project]
name = "laserfiche-mcp"
version = "2.0.0"
description = "Model Context Protocol server for Laserfiche document management systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Samuel S. Hernandez" },
]
keywords = ["mcp", "laserfiche", "claude", "anthropic", "ecm", "document-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27.0,<1",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "pypdf>=4.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
laserfiche-mcp = "laserfiche_mcp.server:main"

[project.urls]
Homepage = "https://github.com/SamuelSHernandez/laserfiche-mcp"
Repository = "https://github.com/SamuelSHernandez/laserfiche-mcp"
Documentation = "https://github.com/SamuelSHernandez/laserfiche-mcp#readme"
Changelog = "https://github.com/SamuelSHernandez/laserfiche-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/SamuelSHernandez/laserfiche-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laserfiche_mcp"]

# Ensure the PEP 561 marker ships in the wheel so downstream type checkers
# treat the package as typed.
[tool.hatch.build.targets.wheel.force-include]
"src/laserfiche_mcp/py.typed" = "laserfiche_mcp/py.typed"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RET"]

[tool.ruff.format]
# Match ruff's default style explicitly so CI's `ruff format --check` has a
# stable target across ruff versions.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
# Gate enforced in CI. To run locally: `uv run mypy`.
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits a real Laserfiche Repository API. Opt in by setting LF_INTEGRATION_TEST=1.",
]
# pytest-cov is wired through addopts so `uv run pytest` enforces the
# baseline; opt out for a single run with `--no-cov` if you need to.
addopts = "--cov=laserfiche_mcp --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["src/laserfiche_mcp"]
# Integration tests are auto-skipped in default runs so they would otherwise
# count as uncovered code. Exclude them from the coverage source.
omit = ["tests/*"]

[tool.coverage.report]
# Lines that are explicitly defensive or only run under tooling we don't
# exercise in unit tests (FastMCP lifespan, main() argv parsing).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
