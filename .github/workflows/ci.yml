name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff (lint)
        run: uv run ruff check src tests

      - name: Run ruff (format)
        run: uv run ruff format --check src tests

      - name: Run mypy
        run: uv run mypy

      - name: Run pytest
        run: uv run pytest -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Audits the locked, resolved dependency set (incl. extras) against the
      # PyPI advisory database; fails the build on any known vulnerability.
      - name: pip-audit
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras > requirements-audit.txt
          uvx pip-audit --strict --no-deps --disable-pip -r requirements-audit.txt
