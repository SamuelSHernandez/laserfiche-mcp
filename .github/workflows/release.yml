name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: the tag must match the version in pyproject.toml AND manifest.json.
      # Fails the whole release before anything is published, so a forgotten
      # version bump can't ship a mismatched PyPI package or .mcpb.
      - name: Verify tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          pyproject_v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          manifest_v=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "tag=$version  pyproject=$pyproject_v  manifest=$manifest_v"
          if [ "$version" != "$pyproject_v" ]; then
            echo "::error::tag v$version does not match pyproject.toml version $pyproject_v"; exit 1
          fi
          if [ "$version" != "$manifest_v" ]; then
            echo "::error::tag v$version does not match manifest.json version $manifest_v"; exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (OIDC)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/laserfiche-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Build .mcpb and attach everything to the release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The Python distributions built earlier (wheel + sdist). Downloaded here
      # so they end up in dist/ alongside the .mcpb for a single upload.
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Node is only needed at build time for the mcpb packer; end users never
      # need it. The .mcpb is packed here (after PyPI publish) so it never lands
      # in the dist/ that the publish job uploads to PyPI.
      - name: Set up Node (for the mcpb packer)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Desktop extension (.mcpb)
        run: bash scripts/build-extension.sh

      - name: Name the .mcpb by version
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv dist/laserfiche-mcp.mcpb "dist/laserfiche-mcp-${version}.mcpb"

      - name: Attach wheel + sdist + .mcpb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
