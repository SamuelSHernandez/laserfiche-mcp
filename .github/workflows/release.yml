name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: the tag must match pyproject.toml, manifest.json, AND server.json.
      # Fails the whole release before anything is published, so a forgotten
      # version bump can't ship a mismatched PyPI package, .mcpb, or registry entry.
      - name: Verify tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          pyproject_v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          manifest_v=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          server_v=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          echo "tag=$version  pyproject=$pyproject_v  manifest=$manifest_v  server=$server_v"
          if [ "$version" != "$pyproject_v" ]; then
            echo "::error::tag v$version does not match pyproject.toml version $pyproject_v"; exit 1
          fi
          if [ "$version" != "$manifest_v" ]; then
            echo "::error::tag v$version does not match manifest.json version $manifest_v"; exit 1
          fi
          if [ "$version" != "$server_v" ]; then
            echo "::error::tag v$version does not match server.json version $server_v"; exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (OIDC)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/laserfiche-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  # Depends on `build`, NOT `publish`: the .mcpb and the GitHub Release must ship
  # even when PyPI publishing fails (e.g. a trusted-publisher misconfiguration).
  # This job packs the .mcpb itself, so it never enters the dist/ the publish job
  # uploads to PyPI. publish and github-release run in parallel off the build.
  github-release:
    name: Build .mcpb and publish the GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The Python distributions built earlier (wheel + sdist). Downloaded here
      # so they end up in dist/ alongside the .mcpb for a single upload.
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Node is only needed at build time for the mcpb packer; end users never
      # need it. Packed in this job (not the build job), so it never lands in the
      # dist/ that the publish job uploads to PyPI.
      - name: Set up Node (for the mcpb packer)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Desktop extension (.mcpb)
        run: bash scripts/build-extension.sh

      # Attach both a versioned file (canonical, immutable per release) and a
      # stable unversioned copy, so /releases/latest/download/laserfiche-mcp.mcpb
      # is a permanent one-click download that always points at the newest release.
      - name: Name the .mcpb (versioned + stable copy)
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp dist/laserfiche-mcp.mcpb "dist/laserfiche-mcp-${version}.mcpb"

      - name: Attach wheel + sdist + .mcpb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Publish (or update) the entry in the official MCP registry from server.json.
  # Runs after PyPI publish because the registry verifies namespace ownership via
  # the `mcp-name` marker in the *published* PyPI README. Authenticates with
  # GitHub OIDC — no token and no interactive login.
  registry:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
